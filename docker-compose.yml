# Local development: Postgres, the API (with auto-reload) and the Vite dev server.
#   docker compose up --build
# Then open http://localhost:5173 and sign in with a demo account.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gauge
      POSTGRES_PASSWORD: gauge
      POSTGRES_DB: gauge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauge"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      GAUGE_DATABASE_URL: postgresql+psycopg://gauge:gauge@db:5432/gauge
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             (python -m app.simulate || echo 'Simulation skipped') &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      GAUGE_API_PROXY: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
